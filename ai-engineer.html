<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineer</title>
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --text: #1d1d1f;
  --muted: #6b6b70;
  --border: #d9d5cc;
  --accent: #2f5bd3;
  --accent-text: #ffffff;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --surface: #1c1c20;
    --text: #ececef;
    --muted: #9a9aa3;
    --border: #34343b;
    --accent: #7c9cff;
    --accent-text: #0b0b0d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113;
  --surface: #1c1c20;
  --text: #ececef;
  --muted: #9a9aa3;
  --border: #34343b;
  --accent: #7c9cff;
  --accent-text: #0b0b0d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.app-header {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.app-title { margin: 0; font-size: 1.25rem; }
.header-controls { display: flex; gap: 8px; align-items: center; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.segmented button {
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 6px 10px;
  font: inherit;
  cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.segmented button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
.app-footer { max-width: 1100px; margin: 0 auto; padding: 16px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header class="app-header">
  <h1 class="app-title" data-i18n="appTitle"></h1>
  <div class="header-controls">
    <div class="segmented" id="lang-switch" role="group"></div>
    <div class="segmented" id="theme-switch" role="group"></div>
  </div>
</header>
<main id="app"></main>
<footer class="app-footer">
  <span data-i18n="footerVersion"></span> MVP 0.1 ·
  <span data-i18n="footerUpdated"></span> 2026-11-06 23:30 (Madrid)
</footer>
<script>
// ════════════════════════════════════════════════════════════════════
// Оглавление
//   1. Языки и строки интерфейса
//   2. Данные: блоки, темы, глоссарий, лента
//   3. Проверка данных (validateData)
//   4. Утилиты
//   5. Состояние и хранилище
//   6. Отрисовка
//   7. Запуск
// ════════════════════════════════════════════════════════════════════
"use strict";

// ═══════ 1. Языки и строки интерфейса ═══════
const LANGS = ["ru", "en", "es"];
const DEFAULT_LANG = "ru";

const UI = {
  appTitle: { ru: "Как стать AI Engineer", en: "How to become an AI Engineer", es: "Cómo ser AI Engineer" },
  footerVersion: { ru: "Версия", en: "Version", es: "Versión" },
  footerUpdated: { ru: "обновлено:", en: "updated:", es: "actualizado:" },
  themeAuto: { ru: "Авто", en: "Auto", es: "Auto" },
  themeLight: { ru: "Светлая", en: "Light", es: "Clara" },
  themeDark: { ru: "Тёмная", en: "Dark", es: "Oscura" },
  langLabel: { ru: "Язык", en: "Language", es: "Idioma" },
  themeLabel: { ru: "Тема оформления", en: "Theme", es: "Tema" },
  emptyState: {
    ru: "Скоро здесь появится карта навыков.",
    en: "The skills map will appear here soon.",
    es: "Pronto aquí aparecerá el mapa de habilidades.",
  },
};

// ═══════ 2. Данные: блоки, темы, глоссарий, лента ═══════
const BLOCKS = [];
const TOPICS = [];
const GLOSSARY = [];
const CHANGELOG = [];

// ═══════ 3. Проверка данных (validateData) ═══════
function isLocalized(value) {
  return value !== null && typeof value === "object"
    && LANGS.every((lang) => typeof value[lang] === "string" && value[lang].trim() !== "");
}

function validateData() {
  const issues = [];
  for (const [key, value] of Object.entries(UI)) {
    if (!isLocalized(value)) issues.push(`UI.${key}: нужен текст на ${LANGS.join("/")}`);
  }
  return issues;
}

// ═══════ 4. Утилиты ═══════
function t(key, lang) {
  return UI[key][lang] ?? UI[key][DEFAULT_LANG];
}

// ═══════ 5. Состояние и хранилище ═══════
const STORAGE_PREFIX = "aie:";
const state = { lang: DEFAULT_LANG, theme: "auto" };

function readStored(name, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + name);
    return raw === null ? fallback : JSON.parse(raw);
  } catch {
    return fallback;
  }
}

function persist(name) {
  try {
    localStorage.setItem(STORAGE_PREFIX + name, JSON.stringify(state[name]));
  } catch {
    // Хранилище недоступно (приватный режим): работаем без сохранения.
  }
}

function normalizeLang(value) {
  return LANGS.includes(value) ? value : DEFAULT_LANG;
}

function normalizeTheme(value) {
  return ["auto", "light", "dark"].includes(value) ? value : "auto";
}

// ═══════ 6. Отрисовка ═══════
function renderSegmented(container, options, current, onPick) {
  container.replaceChildren(...options.map(({ value, label }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(value === current));
    button.addEventListener("click", () => onPick(value));
    return button;
  }));
}

function render() {
  const { lang, theme } = state;
  document.documentElement.lang = lang;
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = theme;
  document.title = t("appTitle", lang);
  for (const node of document.querySelectorAll("[data-i18n]")) {
    node.textContent = t(node.dataset.i18n, lang);
  }

  const langSwitch = document.getElementById("lang-switch");
  langSwitch.setAttribute("aria-label", t("langLabel", lang));
  renderSegmented(langSwitch, LANGS.map((value) => ({ value, label: value.toUpperCase() })), lang, (value) => {
    state.lang = value;
    persist("lang");
    render();
  });

  const themeSwitch = document.getElementById("theme-switch");
  themeSwitch.setAttribute("aria-label", t("themeLabel", lang));
  renderSegmented(themeSwitch, [
    { value: "auto", label: t("themeAuto", lang) },
    { value: "light", label: t("themeLight", lang) },
    { value: "dark", label: t("themeDark", lang) },
  ], theme, (value) => {
    state.theme = value;
    persist("theme");
    render();
  });

  const app = document.getElementById("app");
  const empty = document.createElement("p");
  empty.textContent = t("emptyState", lang);
  app.replaceChildren(empty);
}

// ═══════ 7. Запуск ═══════
const dataIssues = validateData();
if (typeof document !== "undefined") {
  if (dataIssues.length) console.warn("Ошибки данных:", dataIssues);
  state.lang = normalizeLang(readStored("lang", DEFAULT_LANG));
  state.theme = normalizeTheme(readStored("theme", "auto"));
  render();
}
</script>
</body>
</html>
