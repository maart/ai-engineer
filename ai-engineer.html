<style>
:root {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --surface-2: #ebe6db;
  --text: #1d1d1f;
  --muted: #66625a;
  --border: #d6d0c4;
  --accent: #2f5bd3;
  --accent-soft: #e3e9fb;
  --accent-text: #ffffff;
  --must: #b4372a;
  --basic: #8a6100;
  --plus: #2f7a46;
  --code-bg: #f7f5f0;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f11;
    --surface: #1b1b1f;
    --surface-2: #26262c;
    --text: #ececef;
    --muted: #a09fa8;
    --border: #36363e;
    --accent: #8aa6ff;
    --accent-soft: #24304f;
    --accent-text: #0b0b0d;
    --must: #f08a7e;
    --basic: #e2b75a;
    --plus: #79c98f;
    --code-bg: #141417;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f11;
  --surface: #1b1b1f;
  --surface-2: #26262c;
  --text: #ececef;
  --muted: #a09fa8;
  --border: #36363e;
  --accent: #8aa6ff;
  --accent-soft: #24304f;
  --accent-text: #0b0b0d;
  --must: #f08a7e;
  --basic: #e2b75a;
  --plus: #79c98f;
  --code-bg: #141417;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "calt" 0;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.app-title { margin: 0; font-size: 1.15rem; white-space: nowrap; }
.app-title a { color: inherit; text-decoration: none; }
.search {
  flex: 1 1 220px;
  min-width: 0;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
.header-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.segmented button {
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 5px 10px;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.segmented button:focus-visible { outline-offset: -2px; }
.layout {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.nav { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow: auto; }
.nav-toggle { display: none; }
.nav-block { margin-bottom: 6px; }
.nav-block > a {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 5px 8px;
  border-radius: 8px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.nav-block ul { list-style: none; margin: 0; padding: 0 0 0 26px; }
.nav-block li a {
  display: block;
  padding: 3px 8px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 0.92rem;
  text-decoration: none;
}
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--text); }
.nav-num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.2em; }
.content { min-width: 0; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
}
.card + .card { margin-top: 16px; }
.crumbs { margin: 0 0 6px; font-size: 0.9rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
h2.page-title { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 0.88rem; }
.badge {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
}
.badge.must { color: var(--must); }
.badge.basic { color: var(--basic); }
.badge.plus { color: var(--plus); }
.section { margin-top: 20px; }
h3.card-title { margin: 0 0 8px; font-size: 1.1rem; }
.hint { margin: 8px 0 0; color: var(--muted); font-size: 0.88rem; }
.section h3 { margin: 0 0 6px; font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.section p { margin: 0; }
.from-sql { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
pre {
  margin: 0;
  padding: 14px;
  overflow-x: auto;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font: 0.88rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip { padding: 2px 10px; border-radius: 999px; background: var(--surface-2); font-size: 0.9rem; cursor: help; }
.resources { margin: 0; padding-left: 20px; }
.resources li { margin: 4px 0; }
.res-meta { color: var(--muted); font-size: 0.85rem; }
.topic-links { margin: 0; padding-left: 20px; }
.blocks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.block-tile {
  display: block;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  text-decoration: none;
}
.block-tile:hover { border-color: var(--accent); }
.block-tile h3 { margin: 0 0 6px; font-size: 1.02rem; }
.block-tile p { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }
.lead { margin: 0; color: var(--muted); }
.results { margin: 0; padding: 0; list-style: none; }
.results li { padding: 10px 0; border-top: 1px solid var(--border); }
.results li:first-child { border-top: 0; }
.results .kind { color: var(--muted); font-size: 0.82rem; }
.results p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
mark { background: var(--accent-soft); color: inherit; padding: 0 1px; border-radius: 2px; }
.empty { color: var(--muted); }
.progress-link {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.9rem;
  text-decoration: none;
  white-space: nowrap;
}
.progress-link[aria-current="page"] { border-color: var(--accent); }
.bar { position: relative; width: 64px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--plus); }
.bar.wide { width: 100%; height: 8px; }
.status-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; border: 1.5px solid var(--muted); vertical-align: 1px; }
.status-dot.learning { border-color: var(--basic); background: var(--basic); }
.status-dot.understood { border-color: var(--plus); background: var(--plus); }
.status-dot.applied { border-color: var(--accent); background: var(--accent); }
.status-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 0; }
.status-row .segmented button { font-size: 0.85rem; }
textarea {
  width: 100%;
  min-height: 110px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  resize: vertical;
}
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 0.92rem;
  cursor: pointer;
}
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
.btn.link { border: 0; padding: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 0.85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.block-progress { display: grid; grid-template-columns: minmax(0, 1fr) 120px 56px; gap: 6px 12px; align-items: center; margin: 0; }
.block-progress dt { min-width: 0; }
.block-progress dd { margin: 0; color: var(--muted); font-size: 0.88rem; text-align: right; font-variant-numeric: tabular-nums; }
.inbox { margin: 12px 0 0; padding: 0; list-style: none; }
.inbox li { padding: 8px 0; border-top: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: anywhere; }
.inbox time { display: block; color: var(--muted); font-size: 0.8rem; }
.notice { color: var(--plus); font-size: 0.9rem; }
.notice.error { color: var(--must); }
.nav-pages { display: flex; flex-direction: column; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.nav-pages a { padding: 4px 8px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 0.95rem; }
.stale-mark { color: var(--basic); }
.badge.stale { color: var(--basic); border-style: dashed; }
a.chip { color: var(--text); text-decoration: none; cursor: pointer; }
a.chip:hover { background: var(--accent-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
select {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
}
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.9rem; }
.glossary { margin: 16px 0 0; }
.term { padding: 12px 0; border-top: 1px solid var(--border); scroll-margin-top: 90px; }
.term.focused { margin: 0 -12px; padding: 12px; border-radius: 8px; background: var(--accent-soft); }
.term dt { font-weight: 700; }
.term dd { margin: 2px 0 0; }
.term-langs { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 0.9rem; }
.term-langs b { font-size: 0.75rem; }
.term-topics { font-size: 0.9rem; }
.changelog { margin: 16px 0 0; padding: 0; list-style: none; }
.changelog li { padding: 14px 0; border-top: 1px solid var(--border); }
.changelog time { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.changelog h3 { margin: 2px 0 4px; font-size: 1.05rem; }
.changelog p { margin: 0 0 4px; }
.app-footer { max-width: 1200px; margin: 0 auto; padding: 8px 16px 24px; color: var(--muted); font-size: 0.85rem; }
@media (max-width: 760px) {
  .app-header { position: static; }
  .layout { grid-template-columns: minmax(0, 1fr); padding-top: 12px; }
  .nav { position: static; max-height: none; }
  .nav-toggle {
    display: block;
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .nav:not(.open) .nav-tree { display: none; }
  .nav-tree { margin-top: 8px; }
  .card { padding: 16px; }
  .block-progress { grid-template-columns: minmax(0, 1fr) 56px; }
  .block-progress .bar { display: none; }
  h2.page-title { font-size: 1.35rem; }
}
</style>
</head>

// ═══════ 3. Проверка данных (validateData) ═══════
function isLocalized(value) {
  return value !== null && typeof value === "object"
    && LANGS.every((lang) => typeof value[lang] === "string" && value[lang].trim() !== "");
}

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;

function isValidDate(value) {
  if (typeof value !== "string" || !DATE_RE.test(value)) return false;
  const date = new Date(`${value}T00:00:00Z`);
  return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
}

// Проверяет данные справочника. Принимает набор данных, чтобы валидатор
// мог прогонять и заведомо сломанные примеры; по умолчанию — данные страницы.
function validateData(data = { UI, BLOCKS, TOPICS, GLOSSARY, CHANGELOG }) {
  const issues = [];
  const add = (where, message) => issues.push(`${where}: ${message}`);
  const needText = (where, value) => {
    if (!isLocalized(value)) add(where, `нужен текст на ${LANGS.join("/")}`);
  };
  const collectIds = (list, name) => {
    const ids = new Set();
    list.forEach((item, index) => {
      const where = `${name}[${index}]`;
      if (typeof item.id !== "string" || !ID_RE.test(item.id)) add(where, `id «${item.id}» должен быть в kebab-case`);
      else if (ids.has(item.id)) add(where, `повторяющийся id «${item.id}»`);
      else ids.add(item.id);
    });
    return ids;
  };
  const checkRefs = (where, refs, ids, kind) => {
    if (!Array.isArray(refs)) {
      add(where, "должен быть массивом");
      return;
    }
    if (new Set(refs).size !== refs.length) add(where, "ссылки повторяются");
    for (const ref of refs) if (!ids.has(ref)) add(where, `нет ${kind} «${ref}»`);
  };

  for (const [key, value] of Object.entries(data.UI)) needText(`UI.${key}`, value);
  for (const priority of PRIORITIES) if (!data.UI[`priority_${priority}`]) add("UI", `нет строки priority_${priority}`);
  for (const kind of RESOURCE_KINDS) if (!data.UI[`kind_${kind}`]) add("UI", `нет строки kind_${kind}`);

  const blockIds = collectIds(data.BLOCKS, "BLOCKS");
  const topicIds = collectIds(data.TOPICS, "TOPICS");
  const termIds = collectIds(data.GLOSSARY, "GLOSSARY");

  const orders = data.BLOCKS.map((block) => block.order);
  if (new Set(orders).size !== orders.length) add("BLOCKS", "повторяется order");
  for (const block of data.BLOCKS) {
    const where = `BLOCKS.${block.id}`;
    if (!Number.isInteger(block.order)) add(where, "order должен быть целым числом");
    if (!PRIORITIES.includes(block.priority)) add(where, `priority должен быть одним из ${PRIORITIES.join(", ")}`);
    needText(`${where}.title`, block.title);
    needText(`${where}.summary`, block.summary);
  }

  for (const topic of data.TOPICS) {
    const where = `TOPICS.${topic.id}`;
    if (!blockIds.has(topic.block)) add(where, `нет блока «${topic.block}»`);
    for (const field of ["title", "what", "why", "practice"]) needText(`${where}.${field}`, topic[field]);
    if (topic.fromSql !== undefined) needText(`${where}.fromSql`, topic.fromSql);
    checkRefs(`${where}.concepts`, topic.concepts, termIds, "термина");
    checkRefs(`${where}.prereq`, topic.prereq, topicIds, "темы");
    checkRefs(`${where}.related`, topic.related, topicIds, "темы");
    if (Array.isArray(topic.prereq) && topic.prereq.includes(topic.id)) add(where, "тема ссылается на себя в prereq");
    if (Array.isArray(topic.related) && topic.related.includes(topic.id)) add(where, "тема ссылается на себя в related");
    if (!isValidDate(topic.checked)) add(where, "checked должен быть датой ГГГГ-ММ-ДД");
    if (topic.example !== undefined) {
      if (!CODE_LANGS.includes(topic.example.lang)) add(`${where}.example`, `lang должен быть одним из ${CODE_LANGS.join(", ")}`);
      if (typeof topic.example.code !== "string" || topic.example.code.trim() === "") add(`${where}.example`, "пустой code");
    }
    if (!Array.isArray(topic.resources) || topic.resources.length === 0) {
      add(where, "нужен хотя бы один ресурс");
    } else {
      topic.resources.forEach((resource, index) => {
        const at = `${where}.resources[${index}]`;
        if (typeof resource.title !== "string" || resource.title.trim() === "") add(at, "пустой title");
        if (typeof resource.url !== "string" || !/^https:\/\/[^\s]+$/.test(resource.url)) add(at, "url должен начинаться с https://");
        if (!RESOURCE_KINDS.includes(resource.kind)) add(at, `kind должен быть одним из ${RESOURCE_KINDS.join(", ")}`);
        if (!LANGS.includes(resource.lang)) add(at, `lang должен быть одним из ${LANGS.join(", ")}`);
      });
    }
  }

  // Циклы в prereq: тема не может, через цепочку, требовать саму себя.
  const prereqOf = new Map(data.TOPICS.map((topic) => [topic.id, Array.isArray(topic.prereq) ? topic.prereq : []]));
  const visiting = new Set();
  const done = new Set();
  const visit = (id, path) => {
    if (done.has(id)) return;
    if (visiting.has(id)) {
      add("TOPICS", `цикл в prereq: ${[...path, id].join(" → ")}`);
      return;
    }
    visiting.add(id);
    for (const next of prereqOf.get(id) || []) visit(next, [...path, id]);
    visiting.delete(id);
    done.add(id);
  };
  for (const id of prereqOf.keys()) visit(id, []);

  for (const topic of data.TOPICS) {
    for (const termId of Array.isArray(topic.concepts) ? topic.concepts : []) {
      const term = data.GLOSSARY.find((item) => item.id === termId);
      if (term && Array.isArray(term.topics) && !term.topics.includes(topic.id)) {
        add(`GLOSSARY.${termId}.topics`, `нет обратной ссылки на тему «${topic.id}», где термин указан в concepts`);
      }
    }
  }

  for (const term of data.GLOSSARY) {
    const where = `GLOSSARY.${term.id}`;
    needText(`${where}.term`, term.term);
    needText(`${where}.definition`, term.definition);
    checkRefs(`${where}.topics`, term.topics, topicIds, "темы");
  }

  data.CHANGELOG.forEach((entry, index) => {
    const where = `CHANGELOG[${index}]`;
    if (!isValidDate(entry.date)) add(where, "date должен быть датой ГГГГ-ММ-ДД");
    needText(`${where}.title`, entry.title);
    needText(`${where}.text`, entry.text);
    checkRefs(`${where}.topics`, entry.topics, topicIds, "темы");
    if (typeof entry.source !== "string" || !/^https:\/\/[^\s]+$/.test(entry.source)) add(where, "source должен начинаться с https://");
  });
  const dates = data.CHANGELOG.map((entry) => entry.date);
  if (dates.some((date, i) => i > 0 && date > dates[i - 1])) add("CHANGELOG", "записи должны идти от новых к старым");

  return issues;
}

// ═══════ 4. Утилиты ═══════
function t(key, lang) {
  return UI[key][lang] ?? UI[key][DEFAULT_LANG];
}

function loc(value, lang) {
  return value[lang] ?? value[DEFAULT_LANG];
}

const blockById = (id) => BLOCKS.find((block) => block.id === id);
const topicById = (id) => TOPICS.find((topic) => topic.id === id);
const termById = (id) => GLOSSARY.find((term) => term.id === id);
const topicsOfBlock = (id) => TOPICS.filter((topic) => topic.block === id);
const sortedBlocks = () => [...BLOCKS].sort((a, b) => a.order - b.order);

// Разбор адреса: #topic-<id>, #block-<id>, пусто — главная.
function parseRoute(hash) {
  const value = decodeURIComponent(String(hash || "").replace(/^#/, ""));
  if (value === "") return { view: "home" };
  if (value === "progress") return { view: "progress" };
  if (value === "glossary") return { view: "glossary" };
  if (value === "changelog") return { view: "changelog" };
  const match = value.match(/^(topic|block)-(.+)$/);
  if (match && match[1] === "topic" && topicById(match[2])) return { view: "topic", id: match[2] };
  if (match && match[1] === "block" && blockById(match[2])) return { view: "block", id: match[2] };
  const term = value.match(/^term-(.+)$/);
  if (term && termById(term[1])) return { view: "glossary", id: term[1] };
  return { view: "missing" };
}

const STALE_DAYS = 120;

// Тема «устарела», если с даты checked прошло больше STALE_DAYS дней.
function isStale(checked, now = new Date()) {
  const days = Math.floor((now.getTime() - Date.parse(`${checked}T00:00:00Z`)) / 86400000);
  return days > STALE_DAYS;
}

function normalizeForSearch(text) {
  return String(text).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ё/g, "е");
}

// Поиск по текущему языку и английским терминам. Возвращает темы и термины,
// подходящие под все слова запроса; названия весят больше текста.
function search(query, lang) {
  const words = normalizeForSearch(query).split(/\s+/).filter(Boolean);
  if (words.length === 0) return [];
  const score = (title, body) => {
    const head = normalizeForSearch(title);
    const all = `${head} ${normalizeForSearch(body)}`;
    if (!words.every((word) => all.includes(word))) return 0;
    return words.reduce((sum, word) => sum + (head.includes(word) ? 3 : 1), 0);
  };
  const results = [];
  for (const topic of TOPICS) {
    const title = `${loc(topic.title, lang)} ${topic.title.en}`;
    const body = ["what", "why", "fromSql", "practice"].map((field) => (topic[field] ? loc(topic[field], lang) : "")).join(" ");
    const value = score(title, body);
    if (value) results.push({ kind: "topic", id: topic.id, score: value + 1 });
  }
  for (const term of GLOSSARY) {
    const value = score(`${loc(term.term, lang)} ${term.term.en}`, loc(term.definition, lang));
    if (value) results.push({ kind: "term", id: term.id, score: value });
  }
  return results.sort((a, b) => b.score - a.score);
}

// Создание элементов без innerHTML: текст всегда вставляется как текст.
function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "dataset") Object.assign(node.dataset, value);
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

// Подсветка слов запроса в тексте: возвращает узлы.
function highlight(text, query) {
  const words = normalizeForSearch(query).split(/\s+/).filter(Boolean);
  if (!words.length) return [text];
  const folded = normalizeForSearch(text);
  if (folded.length !== text.length) return [text];
  const marks = new Array(text.length).fill(false);
  for (const word of words) {
    let index = folded.indexOf(word);
    while (index !== -1) {
      for (let i = index; i < index + word.length; i += 1) marks[i] = true;
      index = folded.indexOf(word, index + word.length);
    }
  }
  const nodes = [];
  let start = 0;
  for (let i = 1; i <= text.length; i += 1) {
    if (i === text.length || marks[i] !== marks[start]) {
      const piece = text.slice(start, i);
      nodes.push(marks[start] ? h("mark", {}, piece) : piece);
      start = i;
    }
  }
  return nodes;
}

function snippet(text, query, size = 160) {
  const words = normalizeForSearch(query).split(/\s+/).filter(Boolean);
  const folded = normalizeForSearch(text);
  const at = Math.min(...words.map((word) => folded.indexOf(word)).filter((i) => i >= 0), Infinity);
  if (!Number.isFinite(at) || text.length <= size) return text.length <= size ? text : `${text.slice(0, size)}…`;
  const from = Math.max(0, at - 40);
  return `${from > 0 ? "…" : ""}${text.slice(from, from + size)}${from + size < text.length ? "…" : ""}`;
}

// ═══════ 5. Состояние и хранилище ═══════
const STORAGE_PREFIX = "aie:";
const STATUSES = ["todo", "learning", "understood", "applied"];
const DONE_STATUSES = ["understood", "applied"];
const BACKUP_APP = "ai-engineer";
const BACKUP_VERSION = 1;

const state = {
  lang: DEFAULT_LANG,
  theme: "auto",
  query: "",
  navOpen: false,
  topicStatus: {},
  topicNotes: {},
  inbox: [],
  filter: { status: "any", priority: "any", stale: false },
};

function readStored(name, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + name);
    return raw === null ? fallback : JSON.parse(raw);
  } catch {
    return fallback;
  }
}

function persist(name) {
  try {
    localStorage.setItem(STORAGE_PREFIX + name, JSON.stringify(state[name]));
  } catch {
    // Хранилище недоступно (приватный режим): работаем без сохранения.
  }
}

function normalizeLang(value) {
  return LANGS.includes(value) ? value : DEFAULT_LANG;
}

function normalizeTheme(value) {
  return ["auto", "light", "dark"].includes(value) ? value : "auto";
}

const isPlainObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);

// Статусы тем: только известные значения; «не начато» не храним.
// Id неизвестных тем сохраняем: тему могли временно убрать или переименовать.
function normalizeTopicStatus(value) {
  const result = {};
  if (!isPlainObject(value)) return result;
  for (const [id, status] of Object.entries(value)) {
    if (STATUSES.includes(status) && status !== "todo") result[id] = status;
  }
  return result;
}

function normalizeTopicNotes(value) {
  const result = {};
  if (!isPlainObject(value)) return result;
  for (const [id, note] of Object.entries(value)) {
    if (typeof note === "string" && note.trim() !== "") result[id] = note;
  }
  return result;
}

function normalizeInbox(value) {
  if (!Array.isArray(value)) return [];
  const seen = new Set();
  return value.filter((item) => isPlainObject(item)
    && typeof item.id === "string" && !seen.has(item.id) && seen.add(item.id)
    && typeof item.text === "string" && item.text.trim() !== ""
    && typeof item.created === "string" && !Number.isNaN(Date.parse(item.created)))
    .map(({ id, text, created }) => ({ id, text, created }));
}

function topicStatus(id) {
  return state.topicStatus[id] || "todo";
}

function progressCounts(topics = TOPICS) {
  const done = topics.filter((topic) => DONE_STATUSES.includes(topicStatus(topic.id))).length;
  return { done, total: topics.length };
}

function buildBackup(now = new Date()) {
  return {
    app: BACKUP_APP,
    version: BACKUP_VERSION,
    exported: now.toISOString(),
    topicStatus: state.topicStatus,
    topicNotes: state.topicNotes,
    inbox: state.inbox,
  };
}

// Разбирает файл резервной копии. Возвращает нормализованные данные или null.
function parseBackup(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch {
    return null;
  }
  if (!isPlainObject(data) || data.app !== BACKUP_APP || !Number.isInteger(data.version) || data.version > BACKUP_VERSION) return null;
  return {
    topicStatus: normalizeTopicStatus(data.topicStatus),
    topicNotes: normalizeTopicNotes(data.topicNotes),
    inbox: normalizeInbox(data.inbox),
  };
}

// ═══════ 6. Отрисовка ═══════
function renderSegmented(container, options, current, onPick) {
  container.replaceChildren(...options.map(({ value, label }) => {
    const button = h("button", { type: "button", "aria-pressed": String(value === current) }, label);
    button.addEventListener("click", () => onPick(value));
    return button;
  }));
}

function priorityBadge(priority, lang) {
  return h("span", { class: `badge ${priority}` }, t(`priority_${priority}`, lang));
}

function topicLink(id, lang) {
  return h("a", { href: `#topic-${id}` }, loc(topicById(id).title, lang));
}

function renderHeader() {
  const { lang, theme } = state;
  document.documentElement.lang = lang;
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = theme;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n, lang);

  renderProgressLink();

  const searchBox = document.getElementById("search");
  searchBox.placeholder = t("searchPlaceholder", lang);
  searchBox.setAttribute("aria-label", t("searchPlaceholder", lang));

  const langSwitch = document.getElementById("lang-switch");
  langSwitch.setAttribute("aria-label", t("langLabel", lang));
  renderSegmented(langSwitch, LANGS.map((value) => ({ value, label: value.toUpperCase() })), lang, (value) => {
    state.lang = value;
    persist("lang");
    renderAll();
  });

  const themeSwitch = document.getElementById("theme-switch");
  themeSwitch.setAttribute("aria-label", t("themeLabel", lang));
  renderSegmented(themeSwitch, [
    { value: "auto", label: t("themeAuto", lang) },
    { value: "light", label: t("themeLight", lang) },
    { value: "dark", label: t("themeDark", lang) },
  ], theme, (value) => {
    state.theme = value;
    persist("theme");
    renderHeader();
  });
}

function progressBar(done, total, extraClass = "") {
  const percent = total ? Math.round((done / total) * 100) : 0;
  return h("span", { class: `bar ${extraClass}`.trim(), role: "presentation" }, h("span", { style: `width: ${percent}%` }));
}

function renderProgressLink() {
  const { lang } = state;
  const { done, total } = progressCounts();
  const link = document.getElementById("progress-link");
  link.setAttribute("aria-label", `${t("progressLink", lang)}: ${done}/${total}`);
  link.setAttribute("aria-current", parseRoute(location.hash).view === "progress" ? "page" : "false");
  link.replaceChildren(progressBar(done, total), `${done}/${total}`);
}

function renderNav(route) {
  const { lang } = state;
  const currentTopic = route.view === "topic" ? topicById(route.id) : null;
  const currentBlock = route.view === "block" ? route.id : currentTopic?.block;
  document.getElementById("nav").classList.toggle("open", state.navOpen);
  document.getElementById("nav-toggle").setAttribute("aria-expanded", String(state.navOpen));
  const pageLink = (view, key) => h("a", { href: `#${view}`, "aria-current": route.view === view ? "page" : undefined }, t(key, lang));
  document.getElementById("nav-tree").replaceChildren(h("div", { class: "nav-pages" },
    pageLink("glossary", "glossaryTitle"),
    pageLink("changelog", "changelogTitle"),
    pageLink("progress", "progressLink"),
  ), ...sortedBlocks().map((block) => h("div", { class: "nav-block" },
    h("a", {
      href: `#block-${block.id}`,
      "aria-current": route.view === "block" && route.id === block.id ? "page" : undefined,
    }, h("span", { class: "nav-num" }, block.order), loc(block.title, lang)),
    currentBlock === block.id
      ? h("ul", {}, topicsOfBlock(block.id).map((topic) => h("li", {}, h("a", {
        href: `#topic-${topic.id}`,
        "aria-current": currentTopic?.id === topic.id ? "page" : undefined,
      }, h("span", { class: `status-dot ${topicStatus(topic.id)}`, "aria-hidden": "true" }), loc(topic.title, lang),
        isStale(topic.checked) ? h("span", { class: "stale-mark", title: t("stale", lang) }, " ⟳") : null))))
      : null,
  )));
}

function renderHome() {
  const { lang } = state;
  document.title = t("appTitle", lang);
  return [
    h("div", { class: "card" },
      h("h2", { class: "page-title" }, t("appTitle", lang)),
      h("p", { class: "lead" }, t("homeLead", lang)),
    ),
    h("div", { class: "blocks-grid" }, sortedBlocks().map((block) => h("a", { class: "block-tile", href: `#block-${block.id}` },
      h("h3", {}, `${block.order}. ${loc(block.title, lang)}`),
      h("p", {}, loc(block.summary, lang)),
      h("div", { class: "meta" }, priorityBadge(block.priority, lang), `${t("topicsCount", lang)} ${topicsOfBlock(block.id).length}`),
    ))),
    h("div", { class: "card", style: "margin-top: 16px" },
      h("h3", { class: "card-title" }, t("allTopics", lang)),
      h("div", { class: "filters", id: "topic-filters" }),
      h("div", { id: "topic-list" }),
    ),
  ];
}

function filteredTopics(filter = state.filter, now = new Date()) {
  return sortedBlocks().flatMap((block) => topicsOfBlock(block.id)).filter((topic) => {
    if (filter.status !== "any" && topicStatus(topic.id) !== filter.status) return false;
    if (filter.priority !== "any" && blockById(topic.block).priority !== filter.priority) return false;
    if (filter.stale && !isStale(topic.checked, now)) return false;
    return true;
  });
}

function renderTopicList() {
  const { lang } = state;
  const topics = filteredTopics();
  document.getElementById("topic-list").replaceChildren(topics.length
    ? h("ul", { class: "results" }, topics.map((topic) => h("li", {},
      h("div", { class: "kind" }, `${blockById(topic.block).order}. ${loc(blockById(topic.block).title, lang)}`),
      h("span", { class: `status-dot ${topicStatus(topic.id)}`, title: t(`status_${topicStatus(topic.id)}`, lang) }),
      topicLink(topic.id, lang),
      isStale(topic.checked) ? [" ", h("span", { class: "badge stale" }, t("stale", lang))] : null,
    )))
    : h("p", { class: "empty" }, t("filterNothing", lang)));
}

function bindHomeControls() {
  const { lang } = state;
  const select = (name, labelKey, values, labelOf) => {
    const control = h("select", { "aria-label": t(labelKey, lang) },
      h("option", { value: "any" }, `${t(labelKey, lang)}: ${t("filterAny", lang)}`),
      values.map((value) => h("option", { value }, `${t(labelKey, lang)}: ${labelOf(value)}`)));
    control.value = state.filter[name];
    control.addEventListener("change", () => {
      state.filter[name] = control.value;
      renderTopicList();
    });
    return control;
  };
  const stale = h("input", { type: "checkbox", id: "filter-stale" });
  stale.checked = state.filter.stale;
  stale.addEventListener("change", () => {
    state.filter.stale = stale.checked;
    renderTopicList();
  });
  document.getElementById("topic-filters").replaceChildren(
    select("status", "filterStatus", STATUSES, (value) => t(`status_${value}`, lang)),
    select("priority", "filterPriority", PRIORITIES, (value) => t(`priority_${value}`, lang)),
    h("label", { class: "check" }, stale, t("filterStale", lang)),
  );
  renderTopicList();
}

function renderGlossary(focusId) {
  const { lang } = state;
  const collator = new Intl.Collator(lang);
  const terms = [...GLOSSARY].sort((a, b) => collator.compare(loc(a.term, lang), loc(b.term, lang)));
  document.title = `${t("glossaryTitle", lang)} · ${t("appTitle", lang)}`;
  return h("div", { class: "card" },
    h("p", { class: "crumbs" }, h("a", { href: "#" }, t("appTitle", lang))),
    h("h2", { class: "page-title" }, t("glossaryTitle", lang)),
    h("p", { class: "lead" }, t("glossaryLead", lang)),
    terms.length
      ? h("dl", { class: "glossary" }, terms.map((term) => h("div", { class: `term${term.id === focusId ? " focused" : ""}`, id: `term-${term.id}` },
        h("dt", {}, loc(term.term, lang)),
        h("dd", { class: "term-langs" }, LANGS.filter((code) => code !== lang).map((code) => h("span", {}, h("b", {}, code.toUpperCase()), " ", term.term[code]))),
        h("dd", {}, loc(term.definition, lang)),
        h("dd", { class: "term-topics" }, term.topics.map((id, i) => [i ? ", " : "", topicLink(id, lang)])),
      )))
      : h("p", { class: "empty" }, t("glossaryEmpty", lang)),
  );
}

function renderChangelog() {
  const { lang } = state;
  document.title = `${t("changelogTitle", lang)} · ${t("appTitle", lang)}`;
  return h("div", { class: "card" },
    h("p", { class: "crumbs" }, h("a", { href: "#" }, t("appTitle", lang))),
    h("h2", { class: "page-title" }, t("changelogTitle", lang)),
    h("p", { class: "lead" }, t("changelogLead", lang)),
    CHANGELOG.length
      ? h("ol", { class: "changelog" }, CHANGELOG.map((entry) => h("li", {},
        h("time", { datetime: entry.date }, entry.date),
        h("h3", {}, loc(entry.title, lang)),
        h("p", {}, loc(entry.text, lang)),
        h("p", { class: "res-meta" },
          entry.topics.map((id) => [topicLink(id, lang), " · "]),
          h("a", { href: entry.source, target: "_blank", rel: "noopener" }, t("changelogSource", lang))),
      )))
      : h("p", { class: "empty" }, t("changelogEmpty", lang)),
  );
}

function renderBlock(id) {
  const { lang } = state;
  const block = blockById(id);
  const topics = topicsOfBlock(id);
  document.title = `${loc(block.title, lang)} · ${t("appTitle", lang)}`;
  return h("div", { class: "card" },
    h("p", { class: "crumbs" }, h("a", { href: "#" }, t("appTitle", lang))),
    h("h2", { class: "page-title" }, `${block.order}. ${loc(block.title, lang)}`),
    h("div", { class: "meta" }, priorityBadge(block.priority, lang)),
    h("p", {}, loc(block.summary, lang)),
    h("div", { class: "section" },
      topics.length
        ? h("ul", { class: "topic-links" }, topics.map((topic) => h("li", {}, topicLink(topic.id, lang))))
        : h("p", { class: "empty" }, t("noTopicsYet", lang)),
    ),
  );
}

function section(titleKey, lang, ...content) {
  return h("section", { class: "section" }, h("h3", {}, t(titleKey, lang)), content);
}

function renderTopic(id) {
  const { lang } = state;
  const topic = topicById(id);
  const block = blockById(topic.block);
  document.title = `${loc(topic.title, lang)} · ${t("appTitle", lang)}`;
  return h("article", { class: "card" },
    h("p", { class: "crumbs" },
      h("a", { href: "#" }, t("appTitle", lang)), " / ",
      h("a", { href: `#block-${block.id}` }, `${block.order}. ${loc(block.title, lang)}`),
    ),
    h("h2", { class: "page-title" }, loc(topic.title, lang)),
    h("div", { class: "meta" }, priorityBadge(block.priority, lang), `${t("checkedOn", lang)} ${topic.checked}`,
      isStale(topic.checked) ? h("span", { class: "badge stale", title: t("staleHint", lang) }, t("stale", lang)) : null),
    h("div", { class: "status-row" }, h("div", { class: "segmented", id: "topic-status", role: "group", "aria-label": t("statusLabel", lang) })),
    section("sectionWhat", lang, h("p", {}, loc(topic.what, lang))),
    section("sectionWhy", lang, h("p", {}, loc(topic.why, lang))),
    topic.fromSql ? section("sectionFromSql", lang, h("p", { class: "from-sql" }, loc(topic.fromSql, lang))) : null,
    topic.concepts.length ? section("sectionConcepts", lang, h("ul", { class: "chips" }, topic.concepts.map((termId) => {
      const term = termById(termId);
      return h("li", {}, h("a", { class: "chip", href: `#term-${term.id}`, title: loc(term.definition, lang) }, loc(term.term, lang)));
    }))) : null,
    topic.example ? section("sectionExample", lang, h("pre", {}, h("code", { class: `lang-${topic.example.lang}` }, topic.example.code))) : null,
    section("sectionResources", lang, h("ul", { class: "resources" }, topic.resources.map((resource) => h("li", {},
      h("a", { href: resource.url, target: "_blank", rel: "noopener" }, resource.title), " ",
      h("span", { class: "res-meta" }, `· ${t(`kind_${resource.kind}`, lang)} · ${resource.lang.toUpperCase()}`),
    )))),
    section("sectionPractice", lang, h("p", {}, loc(topic.practice, lang))),
    topic.prereq.length ? section("sectionPrereq", lang, h("ul", { class: "topic-links" }, topic.prereq.map((ref) => h("li", {}, topicLink(ref, lang))))) : null,
    topic.related.length ? section("sectionRelated", lang, h("ul", { class: "topic-links" }, topic.related.map((ref) => h("li", {}, topicLink(ref, lang))))) : null,
    section("sectionNotes", lang, h("textarea", { id: "topic-notes", placeholder: t("notesPlaceholder", lang), "aria-label": t("sectionNotes", lang) })),
  );
}

// Элементы управления карточки темы подключаются после вставки в документ.
function bindTopicControls(id) {
  const { lang } = state;
  renderSegmented(document.getElementById("topic-status"), STATUSES.map((value) => ({ value, label: t(`status_${value}`, lang) })), topicStatus(id), (value) => {
    if (value === "todo") delete state.topicStatus[id];
    else state.topicStatus[id] = value;
    persist("topicStatus");
    bindTopicControls(id);
    renderNav(parseRoute(location.hash));
    renderProgressLink();
  });
  const notes = document.getElementById("topic-notes");
  if (notes.dataset.bound) return;
  notes.dataset.bound = "1";
  notes.value = state.topicNotes[id] || "";
  notes.addEventListener("input", () => {
    if (notes.value.trim()) state.topicNotes[id] = notes.value;
    else delete state.topicNotes[id];
    persist("topicNotes");
  });
}

function renderProgress() {
  const { lang } = state;
  const { done, total } = progressCounts();
  const learning = TOPICS.filter((topic) => topicStatus(topic.id) === "learning");
  document.title = `${t("progressLink", lang)} · ${t("appTitle", lang)}`;
  return [
    h("div", { class: "card" },
      h("p", { class: "crumbs" }, h("a", { href: "#" }, t("appTitle", lang))),
      h("h2", { class: "page-title" }, t("progressLink", lang)),
      h("div", { class: "meta" }, `${t("progressSummary", lang)}: ${done}/${total}`),
      progressBar(done, total, "wide"),
      h("p", { class: "hint" }, t("progressHint", lang)),
      h("dl", { class: "block-progress section" }, sortedBlocks().map((block) => {
        const counts = progressCounts(topicsOfBlock(block.id));
        return [
          h("dt", {}, h("a", { href: `#block-${block.id}` }, `${block.order}. ${loc(block.title, lang)}`)),
          progressBar(counts.done, counts.total),
          h("dd", {}, `${counts.done}/${counts.total}`),
        ];
      })),
    ),
    h("div", { class: "card" },
      h("h3", { class: "card-title" }, t("inProgressTitle", lang)),
      learning.length
        ? h("ul", { class: "topic-links" }, learning.map((topic) => h("li", {}, topicLink(topic.id, lang))))
        : h("p", { class: "empty" }, t("inProgressEmpty", lang)),
    ),
    h("div", { class: "card" },
      h("h3", { class: "card-title" }, t("inboxTitle", lang)),
      h("p", { class: "lead" }, t("inboxHint", lang)),
      h("textarea", { id: "inbox-text", "aria-label": t("inboxTitle", lang), style: "min-height: 70px; margin-top: 8px" }),
      h("div", { class: "row" }, h("button", { class: "btn primary", id: "inbox-add", type: "button" }, t("inboxAdd", lang))),
      state.inbox.length
        ? h("ul", { class: "inbox" }, state.inbox.map((item) => h("li", {},
          h("time", { datetime: item.created }, new Date(item.created).toLocaleString(lang)),
          item.text,
          h("div", {}, h("button", { class: "btn link", type: "button", dataset: { inboxDelete: item.id } }, t("inboxDelete", lang))),
        )))
        : h("p", { class: "empty" }, t("inboxEmpty", lang)),
    ),
    h("div", { class: "card" },
      h("h3", { class: "card-title" }, t("backupTitle", lang)),
      h("p", { class: "lead" }, t("backupHint", lang)),
      h("div", { class: "row" },
        h("button", { class: "btn", id: "backup-export", type: "button" }, t("exportButton", lang)),
        h("button", { class: "btn", id: "backup-import", type: "button" }, t("importButton", lang)),
        h("input", { id: "backup-file", type: "file", accept: "application/json,.json", hidden: true }),
        h("span", { class: "notice", id: "backup-notice", role: "status" }),
      ),
    ),
  ];
}

function bindProgressControls() {
  const { lang } = state;
  const text = document.getElementById("inbox-text");
  document.getElementById("inbox-add").addEventListener("click", () => {
    if (!text.value.trim()) return;
    const created = new Date().toISOString();
    state.inbox.unshift({ id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`, text: text.value.trim(), created });
    persist("inbox");
    renderMain();
    document.getElementById("inbox-text").focus();
  });
  for (const button of document.querySelectorAll("[data-inbox-delete]")) {
    button.addEventListener("click", () => {
      state.inbox = state.inbox.filter((item) => item.id !== button.dataset.inboxDelete);
      persist("inbox");
      renderMain();
    });
  }
  document.getElementById("backup-export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(buildBackup(), null, 2)], { type: "application/json" });
    const link = h("a", { href: URL.createObjectURL(blob), download: `ai-engineer-backup-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
  const file = document.getElementById("backup-file");
  document.getElementById("backup-import").addEventListener("click", () => file.click());
  file.addEventListener("change", async () => {
    const chosen = file.files[0];
    if (!chosen) return;
    const data = parseBackup(await chosen.text());
    const notice = document.getElementById("backup-notice");
    if (!data) {
      notice.className = "notice error";
      notice.textContent = t("importFailed", lang);
      file.value = "";
      return;
    }
    if (!window.confirm(t("importConfirm", lang))) {
      file.value = "";
      return;
    }
    Object.assign(state, data);
    persist("topicStatus");
    persist("topicNotes");
    persist("inbox");
    renderAll();
    const after = document.getElementById("backup-notice");
    after.className = "notice";
    after.textContent = t("importDone", lang);
  });
}

function renderSearch(query) {
  const { lang } = state;
  const results = search(query, lang);
  document.title = `${t("searchResults", lang)} · ${t("appTitle", lang)}`;
  return h("div", { class: "card" },
    h("h2", { class: "page-title" }, t("searchResults", lang)),
    results.length
      ? h("ul", { class: "results" }, results.map((result) => {
        if (result.kind === "topic") {
          const topic = topicById(result.id);
          return h("li", {},
            h("div", { class: "kind" }, `${t("kindTopic", lang)} · ${loc(blockById(topic.block).title, lang)}`),
            h("a", { href: `#topic-${topic.id}` }, highlight(loc(topic.title, lang), query)),
            h("p", {}, highlight(snippet(loc(topic.what, lang), query), query)),
          );
        }
        const term = termById(result.id);
        return h("li", {},
          h("div", { class: "kind" }, t("kindTerm", lang)),
          h("strong", {}, highlight(loc(term.term, lang), query)), term.term.en !== loc(term.term, lang) ? ` (${term.term.en})` : "",
          h("p", {}, highlight(loc(term.definition, lang), query)),
          h("p", {}, term.topics.map((id, i) => [i ? ", " : "", topicLink(id, lang)])),
        );
      }))
      : h("p", { class: "empty" }, t("searchNothing", lang)),
  );
}

function renderMain() {
  const route = parseRoute(location.hash);
  renderNav(route);
  const app = document.getElementById("app");
  const { lang } = state;
  let content;
  if (state.query.trim()) content = renderSearch(state.query);
  else if (route.view === "home") content = renderHome();
  else if (route.view === "block") content = renderBlock(route.id);
  else if (route.view === "topic") content = renderTopic(route.id);
  else if (route.view === "progress") content = renderProgress();
  else if (route.view === "glossary") content = renderGlossary(route.id);
  else if (route.view === "changelog") content = renderChangelog();
  else {
    document.title = t("appTitle", lang);
    content = h("div", { class: "card" }, h("p", {}, t("notFound", lang)), h("a", { href: "#" }, t("backHome", lang)));
  }
  app.replaceChildren(...[content].flat());
  if (!state.query.trim() && route.view === "topic") bindTopicControls(route.id);
  if (!state.query.trim() && route.view === "progress") bindProgressControls();
  if (!state.query.trim() && route.view === "home") bindHomeControls();
  if (!state.query.trim() && route.view === "glossary" && route.id) document.getElementById(`term-${route.id}`).scrollIntoView({ block: "center" });
  renderProgressLink();
}

function renderAll() {
  renderHeader();
  renderMain();
}

// ═══════ 7. Запуск ═══════
const dataIssues = validateData();
if (typeof document !== "undefined") {
  if (dataIssues.length) console.warn("Ошибки данных:", dataIssues);
  state.lang = normalizeLang(readStored("lang", DEFAULT_LANG));
  state.theme = normalizeTheme(readStored("theme", "auto"));
  state.topicStatus = normalizeTopicStatus(readStored("topicStatus", {}));
  state.topicNotes = normalizeTopicNotes(readStored("topicNotes", {}));
  state.inbox = normalizeInbox(readStored("inbox", []));

  const searchBox = document.getElementById("search");
  searchBox.addEventListener("input", () => {
    state.query = searchBox.value;
    renderMain();
  });
  searchBox.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      searchBox.value = "";
      state.query = "";
      renderMain();
    }
  });
  window.addEventListener("hashchange", () => {
    // Переход по ссылке закрывает поиск и мобильное меню.
    searchBox.value = "";
    state.query = "";
    state.navOpen = false;
    window.scrollTo(0, 0);
    renderMain();
  });
  document.getElementById("nav-toggle").addEventListener("click", () => {
    state.navOpen = !state.navOpen;
    renderNav(parseRoute(location.hash));
  });
  renderAll();
}
</script>
</body>
</html>
